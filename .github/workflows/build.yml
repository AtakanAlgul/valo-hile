name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: MSBuild'i hazırla
        uses: microsoft/setup-msbuild@v2

      - name: Projeyi derle
        shell: pwsh
        run: |
          msbuild xd.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: release-x64
          path: x64/Release/*
